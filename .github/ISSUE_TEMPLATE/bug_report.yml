name: 🐛 Bug Report
description: Report an issue, unexpected behavior, or error in SwiftBlock
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or CLI commands to reproduce the issue.
      placeholder: |
        1. Run 'swiftblock snap network'
        2. Inspect output
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Terminal output, error stack traces, or command logs.
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - macOS 12 (Monterey)
        - Linux (Ubuntu/Debian)
    validations:
      required: true

  - type: input
    id: swift-version
    attributes:
      label: Swift Version
      description: Output of `swift --version`
      placeholder: e.g. Swift 5.10 / Xcode 15.3
    validations:
      required: true
