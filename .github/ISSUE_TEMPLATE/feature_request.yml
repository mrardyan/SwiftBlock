name: 💡 Feature or Brick Request
description: Suggest an idea, architectural brick, baseplate, or enhancement for SwiftBlock
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make SwiftBlock better or want a new Brick / Baseplate? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Brick Concept
      description: Describe the solution, architectural layer, or brick specification you would like to see.
      placeholder: Add a new brick 'swiftblock snap graphql' that scaffolds Apollo iOS...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a Pull Request to implement this feature!
