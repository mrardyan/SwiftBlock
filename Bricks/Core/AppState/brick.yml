name: app_state
category: infrastructure
instantiation: singleton
description: "Application lifecycle observer tracking active, background, and inactive states"
defaultPath: "App/Sources/Core/AppState"
requiresNameArgument: false

flavors:
  concurrency:
    prompt: "Select concurrency engine"
    default: gcd
    options:
      - id: swift-concurrency
        title: "Swift Concurrency (Actor & Async/Await)"
      - id: gcd
        title: "Grand Central Dispatch (GCD / Thread-Safe)"
