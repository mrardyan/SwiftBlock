name: connectivity
category: infrastructure
instantiation: singleton
description: "Network connectivity and interface reachability monitor using NWPathMonitor"
defaultPath: "App/Sources/Core/Connectivity"
requiresNameArgument: false

dependencies:
  optional:
    - name: logger
      description: "Network path and interface status change logging"

flavors:
  concurrency:
    prompt: "Select concurrency engine"
    default: gcd
    options:
      - id: swift-concurrency
        title: "Swift Concurrency (Actor & AsyncStream)"
      - id: gcd
        title: "Grand Central Dispatch (GCD / Thread-Safe)"
