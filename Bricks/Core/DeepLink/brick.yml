name: DeepLinkRouter
description: URL Scheme and Universal Link deep link parsing and routing manager.
type: singleton
category: core/deeplink
options:
  name: DeepLinkRouter
defaultPath: "App/Sources/Core/DeepLink"

dependencies:
  optional:
    - name: logger
      description: "Deep link route resolution diagnostics"

flavors:
  concurrency:
    prompt: "Select concurrency engine"
    default: gcd
    options:
      - id: swift-concurrency
        title: "Swift Concurrency (Actor & Async/Await)"
      - id: gcd
        title: "Grand Central Dispatch (GCD / Thread-Safe)"
