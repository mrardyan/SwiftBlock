name: storage
category: infrastructure
instantiation: singleton
description: "Persistence storage engine (SwiftData/CoreData/UserDefaults)"
defaultPath: "App/Sources/Core/Storage"
requiresNameArgument: false

dependencies:
  mandatory:
    - name: keyvaluestoring
      reason: "Storage engine implements KeyValueStoring contract"
  optional:
    - name: logger
      description: "Persistence storage transaction and query logging"

flavors:
  driver:
    prompt: "Select persistence storage driver"
    default: swiftdata
    options:
      - id: swiftdata
        title: SwiftData (Modern Swift Concurrency)
      - id: coredata
        title: CoreData (Legacy Compatibility)
      - id: in-memory
        title: In-Memory (Ephemeral Testing)

injections:
  - target: "App/Sources/DependencyContainer.swift"
    marker: "// MARK: - SwiftBlock Dependency Injection Marker"
    content: "register(StorageProtocol.self) { {{moduleName}}() }"
