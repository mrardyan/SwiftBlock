name: mapper
category: architecture
instantiation: generative
description: "DTO to Domain model transformer mapper"
defaultPath: "App/Sources/Features"
requiresNameArgument: true
namingConvention:
  postfix: "Mapper"

dependencies:
  mandatory:
    - name: transforming
      reason: "Mapper implements Transforming protocol contract"

flavors:
  direction:
    prompt: "Select mapping direction"
    default: bidirectional
    options:
      - id: bidirectional
        title: Bidirectional (DTO <-> Domain)
      - id: unidirectional
        title: Unidirectional (DTO -> Domain)
