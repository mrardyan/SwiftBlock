name: scene
category: architecture
instantiation: generative
description: "MVVM Scene with SwiftUI View, ViewModel, and State"
defaultPath: "App/Sources/Features"
requiresNameArgument: true
namingConvention:
  postfix: "Scene"

dependencies:
  optional:
    - name: coordinator
      description: "Navigation routing coordinator"
    - name: usecase
      description: "Domain use case binding"
    - name: haptics
      description: "Tactile haptic feedback on UI interactions"

flavors:
  stateStyle:
    prompt: "Select state observation style"
    default: observable
    options:
      - id: observable
        title: "@Observable (Swift 5.9+ / iOS 17+)"
      - id: combine
        title: ObservableObject (Combine Legacy)

injections:
  - target: "App/Sources/DependencyContainer.swift"
    marker: "// MARK: - SwiftBlock Dependency Injection Marker"
    content: "register({{moduleName}}ViewModel.self) { {{moduleName}}ViewModel() }"
  - target: "App/Sources/AppCoordinator.swift"
    marker: "// MARK: - SwiftBlock Route Enum Marker"
    content: "case {{moduleName.lowercased()}}"
