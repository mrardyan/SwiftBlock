name: usecase
category: architecture
instantiation: generative
description: "Domain UseCase protocol and implementation"
defaultPath: "App/Sources/Features"
requiresNameArgument: true
namingConvention:
  postfix: "UseCase"
dependencies:
  mandatory:
    - name: asyncusecase
      reason: "UseCase requires AsyncUseCase domain contract"
  optional:
    - name: exponentialbackoff
      description: "Auto-retry with exponential backoff & jitter"
    - name: logger
      description: "Structured OSLog call-site logging"
